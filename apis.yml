aid: earendil-robotics
name: Earendil Robotics
description: 'Earendil Robotics is a Y Combinator-backed defense technology company
  registered in England and Wales that builds AI-powered situational-awareness and
  counter-drone systems for tactical units. Its product line includes IVAS, an edge-AI
  vision-augmentation system fusing night vision, thermal imaging, and laser ranging
  for total-darkness operation; Aeglos, an autonomous high-speed (300+ km/h) interceptor
  drone for counter-UAS defense with autonomous target locking and all-weather thermal
  tracking; and Holo, an ultra-lightweight dual-mode tactical sight combining high-resolution
  thermal imaging with a fiber-optic reticle. As of this profile the company exposes
  only a public marketing website and a contact form, with no published developer
  surface, API, SDKs, documentation, or GitHub organization.'
